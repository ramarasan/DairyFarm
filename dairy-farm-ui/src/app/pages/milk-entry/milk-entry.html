<h2>Milk Entry</h2>
    <div class="panel">
      <div class="toolbar">
        <label>Date <input type="date" [(ngModel)]="date" (ngModelChange)="load()" /></label>
        <label>Shift
          <select [(ngModel)]="shift" (ngModelChange)="load()">
            <option>Morning</option><option>Evening</option>
          </select>
        </label>
        <div class="total">Total: <b>{{ total() | number:'1.0-2' }}</b> L</div>
      </div>

      <div class="table-wrap">
        <table>
          <thead><tr><th>Tag</th><th>Name</th><th>Litres</th><th>Fat %</th></tr></thead>
          <tbody>
            @for (r of rows(); track r.cowId) {
              <tr>
                <td>{{ r.tagNumber }}</td><td>{{ r.name }}</td>
                <td><input class="num" type="number" min="0" step="0.1" [(ngModel)]="r.litres" /></td>
                <td><input class="num" type="number" min="0" step="0.1" [(ngModel)]="r.fat" /></td>
              </tr>
            } @empty { <tr><td colspan="4" class="muted">No active cows. Add cows first.</td></tr> }
          </tbody>
        </table>
      </div>

      @if (msg()) { <div [class]="ok() ? 'ok' : 'error'">{{ msg() }}</div> }
      <div class="actions"><button class="btn" (click)="save()" [disabled]="!rows().length">Save {{ shift }} milk</button></div>
    </div>
